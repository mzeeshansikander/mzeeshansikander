<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Animated AI delivery engine network">
<defs>
<radialGradient id="bg" cx="50%" cy="50%" r="64%"><stop offset="0%" stop-color="#16333a"/><stop offset="100%" stop-color="#0d1117"/></radialGradient>
<radialGradient id="core" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#2FD18C" stop-opacity=".85"/>
<stop offset="55%" stop-color="#21AB71" stop-opacity=".2"/>
<stop offset="100%" stop-color="#21AB71" stop-opacity="0"/></radialGradient>
<linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#21AB71" stop-opacity=".15"/>
<stop offset="50%" stop-color="#2FD18C" stop-opacity=".7"/>
<stop offset="100%" stop-color="#21AB71" stop-opacity=".15"/></linearGradient>
<style>
.m{font-family:'Fira Code',ui-monospace,Menlo,monospace}
.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:600}
</style>
</defs>

<rect width="1200" height="320" fill="url(#bg)"/>
<ellipse cx="600" cy="160" rx="300" ry="140" fill="url(#core)">
<animate attributeName="opacity" values=".5;.9;.5" dur="5s" repeatCount="indefinite"/></ellipse>

<text class="m" x="600" y="34" fill="#2FD18C" font-size="12" letter-spacing="5" text-anchor="middle">THE DELIVERY ENGINE</text>

<g stroke="url(#wire)" stroke-width="1.2" fill="none">
<path d="M190 160 L600 160"><animate attributeName="stroke-dasharray" values="0 420;420 0" dur="1.4s" fill="freeze"/></path>
<path d="M600 160 L1010 160"><animate attributeName="stroke-dasharray" values="0 420;420 0" dur="1.4s" begin=".3s" fill="freeze"/></path>
<path d="M600 160 L360 68"><animate attributeName="stroke-dasharray" values="0 260;260 0" dur="1.2s" begin=".5s" fill="freeze"/></path>
<path d="M600 160 L360 252"><animate attributeName="stroke-dasharray" values="0 260;260 0" dur="1.2s" begin=".65s" fill="freeze"/></path>
<path d="M600 160 L840 68"><animate attributeName="stroke-dasharray" values="0 260;260 0" dur="1.2s" begin=".8s" fill="freeze"/></path>
<path d="M600 160 L840 252"><animate attributeName="stroke-dasharray" values="0 260;260 0" dur="1.2s" begin=".95s" fill="freeze"/></path>
</g>

<g fill="#A8F0CE">
<circle r="3.5"><animateMotion path="M190 160 L600 160" dur="2.6s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite"/></circle>
<circle r="3.5"><animateMotion path="M600 160 L1010 160" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></circle>
<circle r="2.6"><animateMotion path="M360 68 L600 160" dur="3.1s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" dur="3.1s" repeatCount="indefinite"/></circle>
<circle r="2.6"><animateMotion path="M360 252 L600 160" dur="3.4s" begin=".7s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" dur="3.4s" begin=".7s" repeatCount="indefinite"/></circle>
<circle r="2.6"><animateMotion path="M600 160 L840 68" dur="2.9s" begin="1.1s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" dur="2.9s" begin="1.1s" repeatCount="indefinite"/></circle>
<circle r="2.6"><animateMotion path="M600 160 L840 252" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
</g>

<g class="s" font-size="12" text-anchor="middle">
<g><circle cx="190" cy="160" r="26" fill="#0E1A1D" stroke="#21AB71" stroke-width="1.6"/>
<circle cx="190" cy="160" r="26" fill="none" stroke="#2FD18C" stroke-width="1" opacity=".6">
<animate attributeName="r" values="26;44" dur="3s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".55;0" dur="3s" repeatCount="indefinite"/></circle>
<text x="190" y="164" fill="#A8F0CE" class="m" font-size="11">BRIEF</text>
<text x="190" y="214" fill="#8D9A9B" font-size="11">Client problem</text></g>

<g><circle cx="600" cy="160" r="46" fill="#0E1A1D" stroke="#2FD18C" stroke-width="2"/>
<circle cx="600" cy="160" r="46" fill="none" stroke="#2FD18C" stroke-width="1.2" opacity=".55">
<animate attributeName="r" values="46;92" dur="3.4s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".5;0" dur="3.4s" repeatCount="indefinite"/></circle>
<g transform="translate(600 160)">
<ellipse rx="34" ry="13" fill="none" stroke="#21AB71" stroke-width=".9" opacity=".65">
<animateTransform attributeName="transform" type="rotate" values="0;360" dur="9s" repeatCount="indefinite"/></ellipse>
<ellipse rx="34" ry="13" fill="none" stroke="#6EC1E4" stroke-width=".9" opacity=".45">
<animateTransform attributeName="transform" type="rotate" values="60;420" dur="7s" repeatCount="indefinite"/></ellipse>
<ellipse rx="34" ry="13" fill="none" stroke="#61CE70" stroke-width=".9" opacity=".5">
<animateTransform attributeName="transform" type="rotate" values="120;480" dur="11s" repeatCount="indefinite"/></ellipse>
</g>
<text x="600" y="164" fill="#ffffff" class="m" font-size="11" font-weight="700">ZENKODERS</text>
<text x="600" y="232" fill="#8D9A9B" font-size="11">Design · Build · Ship · Support</text></g>

<g><circle cx="1010" cy="160" r="26" fill="#0E1A1D" stroke="#21AB71" stroke-width="1.6"/>
<circle cx="1010" cy="160" r="26" fill="none" stroke="#2FD18C" stroke-width="1" opacity=".6">
<animate attributeName="r" values="26;44" dur="3s" begin="1.5s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".55;0" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
<text x="1010" y="164" fill="#A8F0CE" class="m" font-size="11">LIVE</text>
<text x="1010" y="214" fill="#8D9A9B" font-size="11">Product in market</text></g>
</g>

<g class="m" font-size="10" text-anchor="middle" fill="#8D9A9B">
<g><rect x="304" y="50" width="112" height="34" rx="8" fill="#0E1A1D" stroke="#21AB71" stroke-width="1" opacity="0">
<animate attributeName="opacity" values="0;1" dur=".5s" begin="1.2s" fill="freeze"/></rect>
<text x="360" y="72" fill="#61CE70" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1.3s" fill="freeze"/>MOBILE</text></g>
<g><rect x="304" y="234" width="112" height="34" rx="8" fill="#0E1A1D" stroke="#21AB71" stroke-width="1" opacity="0">
<animate attributeName="opacity" values="0;1" dur=".5s" begin="1.35s" fill="freeze"/></rect>
<text x="360" y="256" fill="#61CE70" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1.45s" fill="freeze"/>WEB</text></g>
<g><rect x="784" y="50" width="112" height="34" rx="8" fill="#0E1A1D" stroke="#21AB71" stroke-width="1" opacity="0">
<animate attributeName="opacity" values="0;1" dur=".5s" begin="1.5s" fill="freeze"/></rect>
<text x="840" y="72" fill="#6EC1E4" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1.6s" fill="freeze"/>AI / LLM</text></g>
<g><rect x="784" y="234" width="112" height="34" rx="8" fill="#0E1A1D" stroke="#21AB71" stroke-width="1" opacity="0">
<animate attributeName="opacity" values="0;1" dur=".5s" begin="1.65s" fill="freeze"/></rect>
<text x="840" y="256" fill="#6EC1E4" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1.75s" fill="freeze"/>CLOUD</text></g>
</g>

<text class="m" x="600" y="302" fill="#8D9A9B" font-size="11" text-anchor="middle" opacity="0">
<animate attributeName="opacity" values="0;1" dur=".6s" begin="2s" fill="freeze"/>one team, one pipeline — brief to production</text>
</svg>
