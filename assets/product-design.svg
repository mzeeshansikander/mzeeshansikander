<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Product design and delivery pipeline">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#16333a"/><stop offset="100%" stop-color="#0d1117"/></linearGradient>
<linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#21AB71" stop-opacity=".2"/>
<stop offset="50%" stop-color="#2FD18C" stop-opacity=".75"/>
<stop offset="100%" stop-color="#21AB71" stop-opacity=".2"/></linearGradient>
<style>
.m{font-family:'Fira Code',ui-monospace,Menlo,monospace}
.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
</style>
</defs>

<rect width="1200" height="340" fill="url(#bg)"/>
<text class="m" x="600" y="34" fill="#2FD18C" font-size="12" letter-spacing="5" text-anchor="middle">PRODUCT · DESIGN · DELIVERY</text>

<line x1="120" y1="150" x2="1080" y2="150" stroke="url(#track)" stroke-width="2">
<animate attributeName="stroke-dasharray" values="0 960;960 0" dur="1.6s" fill="freeze"/></line>

<circle r="4.5" fill="#A8F0CE"><animateMotion path="M120 150 L1080 150" dur="5s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/></circle>

<g class="s" font-size="13" text-anchor="middle" fill="#ffffff">

<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".55s" begin=".3s" fill="freeze"/>
<circle cx="120" cy="150" r="20" fill="#0E1A1D" stroke="#2FD18C" stroke-width="1.8"/>
<text class="m" x="120" y="155" fill="#2FD18C" font-size="12">01</text>
<text x="120" y="102" fill="#ffffff">Discover</text>
<text class="m" x="120" y="196" fill="#8D9A9B" font-size="10">goals · users</text>
<text class="m" x="120" y="211" fill="#8D9A9B" font-size="10">constraints</text></g>

<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".55s" begin=".5s" fill="freeze"/>
<circle cx="312" cy="150" r="20" fill="#0E1A1D" stroke="#2FD18C" stroke-width="1.8"/>
<text class="m" x="312" y="155" fill="#2FD18C" font-size="12">02</text>
<text x="312" y="102" fill="#ffffff">Scope</text>
<text class="m" x="312" y="196" fill="#8D9A9B" font-size="10">MVP cut · budget</text>
<text class="m" x="312" y="211" fill="#8D9A9B" font-size="10">fixed timeline</text></g>

<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".55s" begin=".7s" fill="freeze"/>
<circle cx="504" cy="150" r="20" fill="#0E1A1D" stroke="#6EC1E4" stroke-width="1.8"/>
<text class="m" x="504" y="155" fill="#6EC1E4" font-size="12">03</text>
<text x="504" y="102" fill="#ffffff">Design</text>
<text class="m" x="504" y="196" fill="#8D9A9B" font-size="10">Figma flows</text>
<text class="m" x="504" y="211" fill="#8D9A9B" font-size="10">clickable proto</text></g>

<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".55s" begin=".9s" fill="freeze"/>
<circle cx="696" cy="150" r="20" fill="#0E1A1D" stroke="#2FD18C" stroke-width="1.8"/>
<text class="m" x="696" y="155" fill="#2FD18C" font-size="12">04</text>
<text x="696" y="102" fill="#ffffff">Build</text>
<text class="m" x="696" y="196" fill="#8D9A9B" font-size="10">2-week sprints</text>
<text class="m" x="696" y="211" fill="#8D9A9B" font-size="10">demo every one</text></g>

<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".55s" begin="1.1s" fill="freeze"/>
<circle cx="888" cy="150" r="20" fill="#0E1A1D" stroke="#2FD18C" stroke-width="1.8"/>
<text class="m" x="888" y="155" fill="#2FD18C" font-size="12">05</text>
<text x="888" y="102" fill="#ffffff">Ship</text>
<text class="m" x="888" y="196" fill="#8D9A9B" font-size="10">stores · cloud</text>
<text class="m" x="888" y="211" fill="#8D9A9B" font-size="10">CI/CD · monitoring</text></g>

<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".55s" begin="1.3s" fill="freeze"/>
<circle cx="1080" cy="150" r="20" fill="#0E1A1D" stroke="#61CE70" stroke-width="1.8"/>
<text class="m" x="1080" y="155" fill="#61CE70" font-size="12">06</text>
<text x="1080" y="102" fill="#ffffff">Support</text>
<text class="m" x="1080" y="196" fill="#8D9A9B" font-size="10">iterate on real</text>
<text class="m" x="1080" y="211" fill="#8D9A9B" font-size="10">usage data</text></g>
</g>

<g>
<rect x="120" y="252" width="960" height="46" rx="10" fill="#0E1A1D" stroke="#21AB71" stroke-width="1" opacity="0">
<animate attributeName="opacity" values="0;1" dur=".6s" begin="1.6s" fill="freeze"/></rect>
<text class="m" x="600" y="280" fill="#8D9A9B" font-size="12" text-anchor="middle" opacity="0">
<animate attributeName="opacity" values="0;1" dur=".6s" begin="1.75s" fill="freeze"/>fixed scope · fixed price · weekly demos · you own the code</text>
</g>
</svg>
