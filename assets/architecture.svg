<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Layered product architecture diagram">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#16333a"/><stop offset="100%" stop-color="#0d1117"/></linearGradient>
<linearGradient id="lay" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#1A2C30"/><stop offset="55%" stop-color="#1c3a3c"/><stop offset="100%" stop-color="#1A2C30"/></linearGradient>
<linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#2FD18C" stop-opacity="0"/>
<stop offset="50%" stop-color="#2FD18C" stop-opacity=".9"/>
<stop offset="100%" stop-color="#2FD18C" stop-opacity="0"/></linearGradient>
<style>
.m{font-family:'Fira Code',ui-monospace,Menlo,monospace}
.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:600}
</style>
</defs>

<rect width="1200" height="360" fill="url(#bg)"/>
<text class="m" x="600" y="32" fill="#2FD18C" font-size="12" letter-spacing="5" text-anchor="middle">HOW THE PLATFORMS ARE BUILT</text>

<g>
<rect x="80" y="56" width="1040" height="58" rx="10" fill="url(#lay)" stroke="#21AB71" stroke-width="1.1" opacity="0">
<animate attributeName="opacity" values="0;1" dur=".6s" begin=".15s" fill="freeze"/>
<animate attributeName="x" values="110;80" dur=".6s" begin=".15s" fill="freeze" calcMode="spline" keySplines=".2 .85 .2 1" keyTimes="0;1"/></rect>
<text class="s" x="106" y="82" fill="#ffffff" font-size="14" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".35s" fill="freeze"/>CLIENT</text>
<text class="m" x="106" y="102" fill="#8D9A9B" font-size="11" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".4s" fill="freeze"/>React Native (iOS · Android) · React · Next.js · Tailwind · Material UI</text>
<text class="m" x="1094" y="92" fill="#61CE70" font-size="11" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".45s" fill="freeze"/>one codebase, both stores</text>
</g>

<g>
<rect x="80" y="130" width="1040" height="58" rx="10" fill="url(#lay)" stroke="#21AB71" stroke-width="1.1" opacity="0">
<animate attributeName="opacity" values="0;1" dur=".6s" begin=".45s" fill="freeze"/>
<animate attributeName="x" values="110;80" dur=".6s" begin=".45s" fill="freeze" calcMode="spline" keySplines=".2 .85 .2 1" keyTimes="0;1"/></rect>
<text class="s" x="106" y="156" fill="#ffffff" font-size="14" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".65s" fill="freeze"/>SERVICES</text>
<text class="m" x="106" y="176" fill="#8D9A9B" font-size="11" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".7s" fill="freeze"/>Node.js · NestJS · Express · GraphQL · REST · queues · webhooks</text>
<text class="m" x="1094" y="166" fill="#61CE70" font-size="11" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".75s" fill="freeze"/>typed contracts end to end</text>
</g>

<g>
<rect x="80" y="204" width="1040" height="58" rx="10" fill="url(#lay)" stroke="#6EC1E4" stroke-width="1.1" opacity="0">
<animate attributeName="opacity" values="0;1" dur=".6s" begin=".75s" fill="freeze"/>
<animate attributeName="x" values="110;80" dur=".6s" begin=".75s" fill="freeze" calcMode="spline" keySplines=".2 .85 .2 1" keyTimes="0;1"/></rect>
<text class="s" x="106" y="230" fill="#ffffff" font-size="14" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".95s" fill="freeze"/>INTELLIGENCE</text>
<text class="m" x="106" y="250" fill="#8D9A9B" font-size="11" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1s" fill="freeze"/>LLM integration · RAG · chatbots · document &amp; workflow automation</text>
<text class="m" x="1094" y="240" fill="#6EC1E4" font-size="11" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1.05s" fill="freeze"/>AI where it earns its keep</text>
</g>

<g>
<rect x="80" y="278" width="1040" height="58" rx="10" fill="url(#lay)" stroke="#21AB71" stroke-width="1.1" opacity="0">
<animate attributeName="opacity" values="0;1" dur=".6s" begin="1.05s" fill="freeze"/>
<animate attributeName="x" values="110;80" dur=".6s" begin="1.05s" fill="freeze" calcMode="spline" keySplines=".2 .85 .2 1" keyTimes="0;1"/></rect>
<text class="s" x="106" y="304" fill="#ffffff" font-size="14" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1.25s" fill="freeze"/>PLATFORM</text>
<text class="m" x="106" y="324" fill="#8D9A9B" font-size="11" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1.3s" fill="freeze"/>AWS · Azure · DigitalOcean · Firebase · Supabase · Postgres · Mongo · DynamoDB</text>
<text class="m" x="1094" y="314" fill="#61CE70" font-size="11" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1.35s" fill="freeze"/>monitored, backed up, boring</text>
</g>

<g stroke="url(#flow)" stroke-width="2" fill="none" opacity=".85">
<line x1="600" y1="114" x2="600" y2="130"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></line>
<line x1="600" y1="188" x2="600" y2="204"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin=".4s" repeatCount="indefinite"/></line>
<line x1="600" y1="262" x2="600" y2="278"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin=".8s" repeatCount="indefinite"/></line>
</g>

<g fill="#A8F0CE">
<circle r="2.6" opacity=".9"><animateMotion path="M600 60 L600 336" dur="3.6s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;.95;.95;0" dur="3.6s" repeatCount="indefinite"/></circle>
<circle r="2.2" opacity=".7"><animateMotion path="M600 60 L600 336" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;.8;.8;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></circle>
</g>
</svg>
