<text x="470" y="370" fill="#8D9A9B" font-size="11" letter-spacing="2">TEAM MEMBERS</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="1.46s" fill="freeze"/>
