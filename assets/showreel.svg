<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Muhammad Zeeshan Sikander - founder motion showreel">
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="72%"><stop offset="0%" stop-color="#16333a"/><stop offset="100%" stop-color="#0d1117"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#21AB71" stop-opacity=".78"/>
<stop offset="55%" stop-color="#2FD18C" stop-opacity=".16"/>
<stop offset="100%" stop-color="#21AB71" stop-opacity="0"/></radialGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#2FD18C" stop-opacity="0"/>
<stop offset="50%" stop-color="#2FD18C" stop-opacity=".85"/>
<stop offset="100%" stop-color="#2FD18C" stop-opacity="0"/></linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#ffffff"/><stop offset="58%" stop-color="#A8F0CE"/><stop offset="100%" stop-color="#2FD18C"/></linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#21AB71" stop-opacity="0"/>
<stop offset="50%" stop-color="#21AB71" stop-opacity=".7"/>
<stop offset="100%" stop-color="#21AB71" stop-opacity="0"/></linearGradient>
<style>
.h{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:800}
.m{font-family:'Fira Code',ui-monospace,Menlo,monospace}
.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:600}
</style>
</defs>

<rect width="1200" height="420" fill="url(#bg)"/>
