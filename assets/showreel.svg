<g class="m" text-anchor="middle">
<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="1.1s" fill="freeze"/>
<text x="210" y="348" fill="#2FD18C" font-size="26" font-weight="700">200+</text>
<text x="210" y="370" fill="#8D9A9B" font-size="11" letter-spacing="2">PROJECTS DELIVERED</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="1.28s" fill="freeze"/>
