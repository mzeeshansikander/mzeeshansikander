<text x="730" y="370" fill="#8D9A9B" font-size="11" letter-spacing="2">ORDERS DELIVERED</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="1.64s" fill="freeze"/>
<text x="990" y="348" fill="#2FD18C" font-size="26" font-weight="700">10+</text>
<text x="990" y="370" fill="#8D9A9B" font-size="11" letter-spacing="2">YEARS EXPERIENCE</text></g>
