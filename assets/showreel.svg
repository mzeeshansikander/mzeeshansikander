<circle cx="600" cy="196" r="0" fill="none" stroke="#2FD18C" stroke-width="1" opacity=".5">
<animate attributeName="r" values="0;300" dur="4s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".45;0" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="600" cy="196" r="0" fill="none" stroke="#21AB71" stroke-width="1" opacity=".4">
<animate attributeName="r" values="0;300" dur="4s" begin="2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values=".4;0" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
