<rect x="-420" y="0" width="420" height="420" fill="url(#sweep)" opacity=".12">
<animate attributeName="x" values="-420;1200" dur="7s" repeatCount="indefinite"/></rect>

<rect x="60" y="58" width="0" height="1" fill="url(#rule)">
<animate attributeName="width" values="0;1080" dur="1.1s" fill="freeze" calcMode="spline" keySplines=".2 .85 .2 1" keyTimes="0;1"/></rect>

<text class="m" x="600" y="118" fill="#2FD18C" font-size="13" letter-spacing="6" text-anchor="middle" opacity="0">
<animate attributeName="opacity" values="0;.95" dur=".7s" begin=".25s" fill="freeze"/>FOUNDER &amp; CEO — ZENKODERS</text>

<text class="h" x="600" y="196" fill="url(#txt)" font-size="62" letter-spacing="1" text-anchor="middle" opacity="0">
<animate attributeName="opacity" values="0;1" dur=".9s" begin=".45s" fill="freeze"/>
<animate attributeName="y" values="210;196" dur=".9s" begin=".45s" fill="freeze" calcMode="spline" keySplines=".2 .85 .2 1" keyTimes="0;1"/>MUHAMMAD ZEESHAN</text>

<text class="s" x="600" y="234" fill="#8D9A9B" font-size="18" letter-spacing="9" text-anchor="middle" opacity="0">
<animate attributeName="opacity" values="0;.9" dur=".7s" begin=".85s" fill="freeze"/>S &#160; I &#160; K &#160; A &#160; N &#160; D &#160; E &#160; R</text>

<g text-anchor="middle" font-size="17" class="s">
<text x="600" y="276" fill="#A8F0CE" opacity="0">
<animate attributeName="opacity" values="0;1;1;0;0;0;0;0" dur="12s" begin="1.3s" repeatCount="indefinite" keyTimes="0;.04;.29;.33;.5;.75;.9;1"/>Scalable Mobile Apps · Web Platforms · AI Solutions</text>
<text x="600" y="276" fill="#A8F0CE" opacity="0">
<animate attributeName="opacity" values="0;0;0;1;1;0;0;0" dur="12s" begin="1.3s" repeatCount="indefinite" keyTimes="0;.29;.33;.37;.62;.66;.9;1"/>10+ Years Shipping Production Software</text>
<text x="600" y="276" fill="#A8F0CE" opacity="0">
<animate attributeName="opacity" values="0;0;0;0;0;1;1;0" dur="12s" begin="1.3s" repeatCount="indefinite" keyTimes="0;.29;.62;.66;.7;.74;.95;1"/>From Solo Engineer to an 80+ Person Team</text>
