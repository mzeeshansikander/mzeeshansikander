name: Refresh Contribution Stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update-stats.mjs', '.github/workflows/stats.yml']

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate README structure
        run: node scripts/check-readme.mjs

      - name: Fetch live stats and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/update-stats.mjs

      - name: Re-validate after update
        run: node scripts/check-readme.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contributions.svg
          if git diff --staged --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "chore: refresh contribution stats [skip ci]"

          # the snake workflow commits to main too, so a plain push races it and
          # is rejected non-fast-forward. Rebase onto whatever landed and retry.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $i)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 3))
          done
          echo "could not push after 5 attempts"; exit 1
