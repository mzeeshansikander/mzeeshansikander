name: Generate Contribution Snake

# Writes the snake straight into assets/ on main rather than a detached
# `output` branch. A separate branch does not exist until the first run,
# which leaves a broken image on the profile in the meantime — and a 404
# inside a <picture><source> does NOT fall back to the <img>.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # version the snake URLs so GitHub's camo proxy serves the new image
          # instead of a cached copy of the previous one
          stamp=$(date -u +%Y%m%d%H%M)
          sed -i -E "s#(assets/snake(-dark)?\.svg)(\?v=[0-9]+)?#\1?v=$stamp#g" README.md

          git add assets/snake.svg assets/snake-dark.svg README.md
          if git diff --staged --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "chore: refresh contribution snake [skip ci]"

          # the stats workflow commits to main too, so a plain push races it and
          # is rejected non-fast-forward. Rebase onto whatever landed and retry.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $i)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 3))
          done
          echo "could not push after 5 attempts"; exit 1
