name: Generate Contribution Snake

# Writes the snake straight into assets/ on main rather than a detached
# `output` branch. A separate branch does not exist until the first run,
# which leaves a broken image on the profile in the meantime — and a 404
# inside a <picture><source> does NOT fall back to the <img>.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg assets/snake-dark.svg
          git diff --staged --quiet || git commit -m "chore: refresh contribution snake [skip ci]"
          git push
